<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluid Volume — WebGPU MLS-MPM</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body, html {
        height: 100%;
        width: 100%;
        margin: 0;
        overflow: hidden;
        background: #050914;
        color: #e5f9ff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        background:
          radial-gradient(circle at 53% 46%, rgba(20, 85, 121, 0.36), transparent 42%),
          linear-gradient(145deg, #081426, #04070e 75%);
      }

      #debug-info {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 30;
        pointer-events: none;
      }

      #error-reason:not(:empty) {
        display: block;
        max-width: min(600px, calc(100vw - 36px));
        padding: 12px 14px;
        border: 1px solid rgba(255, 127, 127, 0.56);
        border-radius: 8px;
        color: #ffd5d5;
        background: rgba(85, 13, 24, 0.88);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
        font-size: 13px;
        line-height: 1.45;
      }

      #sim-panel {
        position: fixed;
        z-index: 10;
        top: 22px;
        left: 24px;
        min-width: 220px;
        padding: 14px 16px 13px;
        border: 1px solid rgba(164, 224, 244, 0.16);
        border-radius: 10px;
        background: linear-gradient(145deg, rgba(8, 19, 35, 0.88), rgba(8, 14, 25, 0.67));
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.26);
        backdrop-filter: blur(12px);
        pointer-events: none;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: #7aa9c1;
        font-size: 9px;
        font-weight: 760;
        letter-spacing: 0.17em;
      }

      #simulation-state {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 6px;
        color: #9df3ff;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }

      #simulation-state::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: currentColor;
        box-shadow: 0 0 12px currentColor;
      }

      #sim-detail {
        margin: 0;
        color: #8fa8ba;
        font-size: 11px;
        letter-spacing: 0.025em;
      }

      #interaction-hint {
        position: fixed;
        z-index: 10;
        right: 22px;
        bottom: 20px;
        padding: 10px 12px;
        border: 1px solid rgba(164, 224, 244, 0.12);
        border-radius: 7px;
        color: #a7bdcd;
        background: rgba(7, 16, 28, 0.55);
        font-size: 11px;
        letter-spacing: 0.025em;
        pointer-events: none;
      }

      #interaction-orb {
        position: fixed;
        z-index: 9;
        width: 42px;
        height: 42px;
        border: 1px solid rgba(164, 248, 255, 0.92);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(151, 246, 255, 0.54) 0%, rgba(52, 202, 255, 0.16) 34%, transparent 68%);
        box-shadow: 0 0 0 7px rgba(78, 220, 255, 0.06), 0 0 28px rgba(68, 220, 255, 0.72);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.58);
        transition: opacity 150ms ease, transform 150ms ease;
      }

      #interaction-orb.active {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      .dg.ac {
        z-index: 20 !important;
      }

      * {
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="fluidCanvas"></canvas>
    <div id="interaction-orb" aria-hidden="true"></div>
    <section id="sim-panel" aria-live="polite">
      <p class="eyebrow">WEBGPU MLS-MPM</p>
      <strong id="simulation-state">SIMULATING</strong>
      <p id="sim-detail">400,000 simulated · 200,000 spheres rendered · 1.5× speed</p>
    </section>
    <div id="debug-info"><span id="error-reason"></span></div>
    <div id="interaction-hint">Click splash · Drag orbit · Space pulse · G add particles · P pause</div>
    <script src="https://unpkg.com/stats.js@0.17.0/build/stats.min.js"></script>
    <script src="https://unpkg.com/dat.gui@0.7.9/build/dat.gui.min.js"></script>
    <script type="module" src="main.js?v=20260712reflective3"></script>
  </body>
</html>
